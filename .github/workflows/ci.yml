name: equitylens-ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax checks
        run: python -m compileall src scripts tests
      - name: Workflow sanity marker
        run: python -c "print('equitylens CI syntax checks passed')"
